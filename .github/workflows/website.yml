name: Website

on:
  workflow_dispatch:
  push:
    branches: [rebuild]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: realmorg/realm
          ref: main
          # Full history, so each page can show the date it last changed.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      # Lists new and changed pages for IndexNow while the old sitemap is still live.
      - run: node scripts/indexnow.mjs apps/site/dist/sitemap.xml indexnow.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/site/dist
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow
          path: indexnow.json
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tells Bing, Yandex and the other IndexNow engines about the pages that just went live.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: indexnow
      - name: Submit new and changed pages to IndexNow
        run: |
          [ -f indexnow.json ] || { echo "No new or changed pages."; exit 0; }
          node -e '
            const batches = require("./indexnow.json");
            (async () => {
              for (const body of batches) {
                const response = await fetch("https://api.indexnow.org/indexnow", {
                  method: "POST",
                  headers: { "content-type": "application/json; charset=utf-8" },
                  body: JSON.stringify(body),
                });
                console.log(`IndexNow: ${body.urlList.length} pages, HTTP ${response.status}`);
                if (response.status >= 400 && response.status !== 429) console.log(await response.text());
              }
            })();
          '
